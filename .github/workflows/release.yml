name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing immutable release tag, for example v0.1.1'
        required: true
        type: string
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate release tag
        run: echo "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check && npm run lint
      - run: npm run test:coverage -- --output "$RUNNER_TEMP/alliance-coverage"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: executed-feature-coverage
          path: ${{ runner.temp }}/alliance-coverage
          if-no-files-found: ignore
      - name: Match tag to package
        run: test "$RELEASE_TAG" = "v$(node -p "require('./package.json').version")"
      - run: npm run release:pack
      - name: Publish private repository assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --title "Alliance Work $RELEASE_TAG" --generate-notes
